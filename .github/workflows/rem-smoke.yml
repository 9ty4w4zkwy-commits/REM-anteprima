name: REM modular smoke tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in lab/modules/*.js; do node --check "$file"; done
      - name: Run module smoke tests
        run: node --test tests/rem-modules.test.cjs
